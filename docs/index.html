<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Saloni Sharma — resume" />
  <title>Saloni Sharma · Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-dim: #388bfd66;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 2rem; }
    header {
      text-align: center;
      padding: 2rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .tagline {
      color: var(--muted);
      font-size: 1rem;
      margin: 0 0 1.25rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .chip {
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s, transform 0.12s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: #0d1117;
    }
    .btn-primary:hover { background: #79b8ff; }
    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .viewer {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      min-height: 72vh;
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .viewer iframe {
      display: block;
      width: 100%;
      height: 72vh;
      border: 0;
    }
    .hint {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 1rem 0 0;
    }
    footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Saloni Sharma</h1>
      <p class="tagline">Backend · ML · AI engineering · Computer science · India</p>
      <div class="chips">
        <span class="chip">Python</span>
        <span class="chip">Machine learning</span>
        <span class="chip">Applied AI</span>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="resume.pdf" download>Download resume (PDF)</a>
        <a class="btn btn-ghost" href="https://www.linkedin.com/in/saloni-sharma-55773028b" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a class="btn btn-ghost" href="https://github.com/Saloni-0465" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </header>

    <div class="viewer">
      <iframe title="Resume PDF" src="resume.pdf"></iframe>
    </div>
    <p class="hint">On mobile, PDF preview may be limited — use <strong>Download resume</strong> for the best view.</p>

    <footer>
      <p>© <span id="y"></span> Saloni Sharma · <a href="https://github.com/Saloni-0465/Saloni-0465">Profile repo</a></p>
    </footer>
  </div>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
